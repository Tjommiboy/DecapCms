backend:
  name: git-gateway
  branch: main
media_folder: "static/media"
public_folder: "/media"
collections:
  - name: "posts"
    label: "Posts"
    folder: "content/posts"
    create: true
    slug: "{{year}}/{{month}}/{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
